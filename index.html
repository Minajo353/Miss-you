<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>٣٠ يوم حب لنورا</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#2a0a1f;--bg2:#5a1440;--pink:#ff6b9d;--soft:#ffd6e7;--card:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--soft);font-family:'Tajawal',sans-serif;overflow-x:hidden}
.heart{position:fixed;bottom:-40px;font-size:20px;opacity:.5;animation:rise linear infinite;pointer-events:none;z-index:0}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:24px 16px 40px;text-align:center}
h1{font-family:'Amiri',serif;font-size:2rem;margin:8px 0;color:#fff;text-shadow:0 0 18px var(--pink);animation:pulse 2.5s ease-in-out infinite;user-select:none}
@keyframes pulse{50%{transform:scale(1.04)}}
#sub{margin:0 0 20px;opacity:.9}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.day{aspect-ratio:1;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:var(--card);color:var(--soft);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.day b{font-size:1.1rem}.day span{font-size:1.1rem}
.day.open{background:linear-gradient(135deg,var(--pink),#c2185b);color:#fff;box-shadow:0 0 14px rgba(255,107,157,.6);animation:pop .5s backwards,glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px rgba(255,107,157,.95)}}
.day.lock{opacity:.5;cursor:default}
#modal{position:fixed;inset:0;background:rgba(20,0,12,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.show{display:flex}
.box{background:linear-gradient(160deg,#4a0f35,#2a0a1f);border:1px solid var(--pink);border-radius:20px;padding:26px 20px;max-width:440px;width:100%;box-shadow:0 0 40px rgba(255,107,157,.4);animation:pop .4s}
.box h2{margin:0 0 12px;font-family:'Amiri',serif;color:#fff}
#msg{font-size:1.15rem;line-height:2;min-height:3em}
#poem{font-family:'Amiri',serif;font-size:1.25rem;line-height:2.1;color:#ffb3d1;margin-top:14px;white-space:pre-line;opacity:0;transition:opacity 1.5s}
#poem.show{opacity:1}
button.close{margin-top:18px;background:var(--pink);color:#fff;border:0;border-radius:12px;padding:10px 26px;font:inherit;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<main>
<h1 id="title">٣٠ يوم حب 💖</h1>
<p id="sub"></p>
<div id="grid"></div>
</main>
<div id="modal"><div class="box"><h2 id="mt"></h2><div id="msg"></div><div id="poem"></div><button class="close" id="cl">💗 تمام</button></div></div>
<script>
// عدّل تاريخ البداية هنا (سنة، شهر من 0-11، يوم). حالياً: 1 نوفمبر 2026
var START=new Date(2026,10,1);
var M=[
["صباح الخير يا نورا… النهاردة أول يوم من ٣٠ يوم، وكل يوم هسيب لك فيهم حتة من قلبي.",""],
["إنتي مش بس حبيبتي، إنتي الأمان اللي برجع له آخر اليوم.","وَما الحُبُّ إلّا أنتِ حينَ تَبتَسِمينَ\nفَيُزهِرُ في صَدري الرَّبيعُ وَيَستَكينُ"],
["سنتين معاكي حسّيت فيهم إني إنسان أحسن. شكراً إنك إنتي.",""],
["ضحكتك دي لو اتباعت مفيش في الدنيا فلوس تكفيها.","ضِحكَتُكِ ضَوءٌ في الدُّجى\nيَهدي إلَيها القَلبُ دَربَهْ"],
["فاكرة أول مرة اتكلمنا؟ أنا لسه فاكر إيدي كانت بترتعش.",""],
["وقفتي جنبي في أوقات كان أي حد مكانك يمشي. ده عمري ما هنساه.","وَفاؤكِ يا نورُ دَينٌ لا أُسَدِّدُهُ\nوَلَو عِشتُ عُمري كُلَّهُ أَرعاكِ"],
["لو الدنيا كلها زعلتني، وشّك بس كفاية يصلّح اليوم.",""],
["اسمك نور وإنتي فعلاً نور… دخلتي حياتي وطردتي الضلمة.","اسمُكِ نورٌ وَأنتِ نورٌ\nفَما لِلَّيلِ في عَيني مَكانُ"],
["بحبك مش عشان إنتي حلوة بس، بحبك عشان قلبك أحلى.",""],
["كل مرة بشوفك فيها بحس إنها أول مرة.","كَأنّي كُلَّما أَبصَرتُ وَجهَكِ\nوُلِدتُ مِنَ الجَديدِ وَما شَبِعتُ"],
["نفسي أبقى ليكي الضهر والسند، زي ما كنتي ليا.",""],
["كلمة منك بتخلي أصعب يوم يعدّي بسهولة.","إذا ضاقَتِ الدُّنيا بِصَدري\nوَسِعَني ذِكرُكِ أَوسَعَ مِن سَمائِها"],
["أحلى حاجة في يومي رسالة منك.",""],
["لو رجعت بيا الأيام مليون مرة هختارك مليون مرة.","وَلَو عادَ بي الزَّمانُ ألفَ مَرَّةٍ\nلَكُنتُ إلَيكِ ألفَ مَرَّةٍ أَعودُ"],
["نص الشهر عدّى… وحبي ليكي زاد مش نقص.",""],
["إنتي الحلم اللي صحيت لقيته حقيقي.","حَلِمتُ بِكِ فَصَحَوتُ أَجِدُكِ\nفَقُلتُ الحَمدُ لِلحُلمِ الصَّدوقِ"],
["عايزك تعرفي إنك تستاهلي كل الحاجات الحلوة، وأنا هفضل أحاول أديهالك.",""],
["كل أغنية حلوة بسمعها بفتكرك.","فَكُلُّ لَحنٍ جَميلٍ في الوُجودِ\nصَدى صَوتِكِ حينَ تَهمِسينَ"],
["مهما بعدنا عن بعض، قلبي دايماً عندك.",""],
["إنتي أحسن قرار خدته في حياتي.","قَرَّرتُ أَن أُحِبَّكِ دونَ خَوفٍ\nفَكانَ القَرارُ أَجمَلَ ما قَرَّرتُ"],
["لو الحب له شكل، هيبقى شكلك.",""],
["بحبك بهدوئك وبشغبك وبكل حالاتك.","أُحِبُّكِ في الهُدوءِ وَفي الجُنونِ\nوَفي الصَّمتِ الَّذي يُخفي الكَلامَ"],
["كل يوم معاكي هدية، وأنا مش عارف أرد الجميل.",""],
["خليكي فاكرة: إنتي أقوى مما تتخيلي، وأنا فخور بيكي.",""],
["يا رب يفضل قلبنا قريب لحد آخر العمر.","سَنَبقى كَما نَحنُ يا نورُ دَوماً\nيَدٌ في يَدٍ وَالعُمرُ دَربٌ نَمشيهِ"],
["نفسي أفضل معاكي لحد ما نحقق كل أحلامنا.",""],
["كل ما أفتكر إنك في حياتي بحس إني أغنى واحد في الدنيا.",""],
["فاضل يومين وتخلص الرسايل… بس كلامي ليكي عمره ما هيخلص.","وَلَو أَنَّ الكَلامَ يَفي بِحُبّي\nلَما كَفاني عُمرٌ كامِلُ"],
["شكراً على ٣٠ يوم من الابتسامة اللي كنتي بتبتسميها وأنتي بتقري.",""],
["آخر رسالة… بحبك يا نورا. النهاردة وبكرة وكل يوم. 💖","وَآخِرُ ما أَقولُ وَلَيسَ آخِرَاً\nأُحِبُّكِ ثُمَّ أُحِبُّكِ ثُمَّ أُحِبُّكِ"]
];
var N=M.length,all=false,taps=0,timer;
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function today(){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.floor((t-START)/864e5)+1}
function render(){
  var d=all?N:Math.max(0,Math.min(N,today())),g=document.getElementById('grid');g.innerHTML='';
  for(var i=1;i<=N;i++){(function(i){
    var b=document.createElement('button');b.className='day '+(i<=d?'open':'lock');b.style.animationDelay=(i*25)+'ms';
    b.innerHTML='<b>'+ar(i)+'</b><span>'+(i<=d?'💌':'🔒')+'</span>';
    b.onclick=function(){i<=d?show(i):hint(i)};g.appendChild(b);
  })(i)}
  document.getElementById('sub').textContent=d<=0?'الرسايل هتبدأ تفتح قريب يا نورا 💕':d>=N?'كل الرسايل اتفتحت… وحبي ليكي لسه بيكبر 💖':'اتفتحت '+ar(d)+' رسالة، وفاضل '+ar(N-d)+' 💕 كل يوم رسالة جديدة';
}
function hint(i){show(0,'رسالة اليوم '+ar(i)+' لسه مقفولة 🔒','استني لسه شوية… الحلو بيجي لوحده 💗')}
function show(i,title,text){
  var m=document.getElementById('modal'),msg=document.getElementById('msg'),p=document.getElementById('poem');
  clearInterval(timer);msg.textContent='';p.className='';p.textContent='';
  document.getElementById('mt').textContent=title||('رسالة اليوم '+ar(i)+' 💌');
  var s=text||M[i-1][0],poem=text?'':M[i-1][1],k=0;
  m.classList.add('show');
  timer=setInterval(function(){
    msg.textContent=s.slice(0,++k);
    if(k>=s.length){clearInterval(timer);if(poem){p.textContent=poem;setTimeout(function(){p.className='show'},50)}}
  },35);
  burst();
}
document.getElementById('cl').onclick=function(){clearInterval(timer);document.getElementById('modal').classList.remove('show')};
function heart(){
  var h=document.createElement('div');h.className='heart';h.textContent=['💖','💕','💗','✨'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw';h.style.fontSize=(14+Math.random()*22)+'px';
  h.style.animationDuration=(6+Math.random()*6)+'s';document.body.appendChild(h);
  setTimeout(function(){h.remove()},13000);
}
function burst(){for(var i=0;i<10;i++)setTimeout(heart,i*80)}
setInterval(heart,700);
// للمعاينة: اضغط على العنوان ٥ مرات يفتح كل الرسايل
document.getElementById('title').onclick=function(){if(++taps>=5){all=!all;taps=0;render()}};
render();
</script>
</body>
</html>
